name: Build EROFS Kernel

on:
  push:
    branches: [erofs-kernel]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  USERNAME: sylphxai

jobs:
  build:
    name: Build Kernel with EROFS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h

      # bldr/Pkgfile uses mergeop which requires containerd image store
      - name: Setup Docker with containerd snapshotter
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info | grep -i "storage\|snapshotter"

      - name: Setup buildx with containerd backend
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Build kernel package
        run: |
          make kernel \
            PLATFORM=linux/amd64 \
            REGISTRY=${{ env.REGISTRY }} \
            USERNAME=${{ env.USERNAME }} \
            PUSH=true \
            TAG=v1.12.6-erofs
        timeout-minutes: 180
